app = 'mcwv-bot'
primary_region = 'lhr'

[build]
dockerfile = "Dockerfile"

[env]
PYTHONUNBUFFERED = "1"

[[services]]
internal_port = 10000
protocol = "tcp"
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 1

[http_service.concurrency]
type = "requests"
hard_limit = 25
soft_limit = 20

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
